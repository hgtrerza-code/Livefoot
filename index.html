<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootLive Pro | Résultats & Scores en Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1e; 
            --bg-card: #1a2332; 
            --bg-card-hover: #232f42; 
            --bg-detail: #141c2b;
            --text-main: #f8fafc; 
            --text-muted: #8b9bb4; 
            --accent: #22c55e; 
            --live-red: #ef4444;
            --border: #2a3650;
            --yellow: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        header { background: linear-gradient(90deg, #0a0f1e 0%, #1a2332 100%); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-content { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .highlight { color: var(--accent); }
        
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .status-badge { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--live-red); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; background: rgba(239, 68, 68, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(239, 68, 68, 0.2); }
        .pulse { width: 8px; height: 8px; background-color: var(--live-red); border-radius: 50%; animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.7); } 70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

        .btn-action { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; gap: 6px; }
        .btn-action:hover { background: var(--bg-card-hover); border-color: var(--accent); }
        .btn-accent { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-accent:hover { background: #16a34a; border-color: #16a34a; transform: translateY(-1px); }

        .stats-bar { display: flex; gap: 18px; padding: .75rem 1rem; background: var(--bg-card); border-radius: 10px; margin: 1rem 0; font-size: .8rem; color: var(--text-muted); flex-wrap: wrap; border: 1px solid var(--border); }
        .stats-bar strong { color: var(--accent); }

        .control-group { margin: 1.2rem 0; display: flex; flex-direction: column; gap: 10px; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filters button { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all .2s; font-weight: 600; font-size: .8rem; font-family: inherit; }
        .filters button.active, .filters button:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        .region-select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-family: inherit; outline: none; cursor: pointer; }

        .search-box { margin-top: 5px; }
        .search-box input { width: 100%; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-family: inherit; font-size: .9rem; outline: none; transition: border-color .2s; }
        .search-box input:focus { border-color: var(--accent); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: rgba(34, 197, 94, 0.95); color: #000; padding: 12px 18px; border-radius: 10px; font-weight: 800; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; gap: 8px; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateY(0); opacity: 1; }

        .competition-group { margin-bottom: 1.5rem; animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .competition-header { font-size: .8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; padding: .5rem 0; border-bottom: 1px solid var(--border); margin-bottom: .75rem; display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .competition-header .flag { font-size: 1rem; }
        .competition-header .count { margin-left: auto; background: var(--bg-card); padding: 2px 8px; border-radius: 10px; font-size: .7rem; text-transform: none; border: 1px solid var(--border); }

        .match-card { background: var(--bg-card); border-radius: 10px; margin-bottom: 8px; border: 1px solid transparent; transition: all .2s; overflow: hidden; }
        .match-card:hover { border-color: var(--border); background: var(--bg-card-hover); }
        .match-card.live { border-left: 4px solid var(--live-red); }
        .match-main { padding: .85rem 1rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; cursor: pointer; }
        .team { font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: 10px; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team-logo { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #334155, #475569); display: flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; flex-shrink: 0; color: #fff; }
        
        .score-box { display: flex; flex-direction: column; align-items: center; min-width: 110px; }
        .score { font-size: 1.15rem; font-weight: 800; background: rgba(255,255,255,.05); padding: 3px 14px; border-radius: 6px; letter-spacing: 1.5px; min-width: 75px; text-align: center; }
        .live .score { color: var(--accent); background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2); }
        .match-time { font-size: .7rem; color: var(--text-muted); margin-top: 4px; font-weight: 600; }
        .live .match-time { color: var(--live-red); }
        
        .progress { width: 100%; height: 4px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress > div { height: 100%; background: var(--live-red); transition: width .5s ease-in-out; }
        .minute-badge { color: var(--live-red); font-weight: 800; }

        .match-details { display: none; background: var(--bg-detail); padding: 1rem; border-top: 1px solid var(--border); font-size: .8rem; }
        .match-card.expanded .match-details { display: block; }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: .75rem; }
        .detail-item { display: flex; gap: 8px; color: var(--text-muted); }
        .detail-item strong { color: var(--text-main); font-weight: 600; }

        .section-title { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: .9rem 0 .5rem; font-weight: 700; }
        
        .events-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .event-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; }
        .event-min { font-weight: 700; color: var(--accent); min-width: 26px; }
        .event-icon { font-size: 0.85rem; }

        .bar-row { margin: 7px 0; font-size: .75rem; }
        .bar-row .vals { display: flex; justify-content: space-between; font-weight: 700; }
        .bar-row .lbl { color: var(--text-muted); font-weight: 500; }
        .bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--border); margin-top: 3px; }
        .bar .h { background: var(--accent); transition: width 0.4s; }
        .bar .a { background: #3b82f6; transition: width 0.4s; }

        .empty { text-align: center; color: var(--text-muted); padding: 3rem 0; background: var(--bg-card); border-radius: 10px; border: 1px dashed var(--border); margin-top: 1rem; }
        footer { border-top: 1px solid var(--border); padding: 1.5rem 0; text-align: center; color: var(--text-muted); font-size: .8rem; margin-top: 3rem; }

        .standings-btn, .follow-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 3px 11px; border-radius: 12px; font-size: .7rem; font-weight: 700; cursor: pointer; font-family: inherit; text-transform: none; letter-spacing: 0; }
        .standings-btn:hover, .follow-btn:hover { border-color: var(--accent); color: var(--text-main); }
        .standings { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: .5rem; margin-bottom: .75rem; overflow-x: auto; }
        .standings table { width: 100%; border-collapse: collapse; font-size: .75rem; margin-bottom: .5rem; min-width: 440px; }
        .standings caption { text-align: left; color: var(--text-muted); font-weight: 700; padding: 4px 6px; text-transform: uppercase; font-size: .65rem; letter-spacing: 1px; }
        .standings th { color: var(--text-muted); font-weight: 600; text-align: center; padding: 4px 6px; border-bottom: 1px solid var(--border); }
        .standings td { text-align: center; padding: 5px 6px; border-bottom: 1px solid rgba(128,128,128,.12); }
        .standings th:nth-child(2), .standings td:nth-child(2) { text-align: left; }
        .standings td.pts { font-weight: 800; }
        .standings tr.playing td { background: rgba(34,197,94,.1); }
        .form span { display: inline-block; width: 16px; height: 16px; line-height: 16px; border-radius: 50%; font-size: .6rem; font-weight: 800; color: #000; margin-right: 2px; }
        .form .V { background: var(--accent); } .form .N { background: var(--yellow); } .form .D { background: var(--live-red); color: #fff; }
        .team-logo.has-img { background: #fff; padding: 2px; }
        .team-logo img { width: 100%; height: 100%; object-fit: contain; }
        .ticker { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-top: .75rem; display: flex; align-items: stretch; overflow: hidden; width: 100%; }
        .ticker-label { flex: 0 0 auto; background: var(--live-red); color: #fff; font-weight: 800; font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; display: flex; align-items: center; gap: 6px; z-index: 1; }
        .ticker-label .pulse { background-color: #fff; }
        .ticker-viewport { flex: 1; overflow: hidden; position: relative; display: flex; align-items: center; mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }
        .ticker-track { display: inline-flex; white-space: nowrap; will-change: transform; animation: ticker-scroll var(--ticker-duration, 60s) linear infinite; }
        .ticker:hover .ticker-track { animation-play-state: paused; }
        .ticker-item { display: inline-flex; align-items: center; gap: 6px; padding: 6px 18px; font-size: .8rem; font-weight: 600; color: var(--text-main); border-right: 1px solid var(--border); }
        .ticker-item .t-comp { color: var(--text-muted); font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
        .ticker-item .t-score { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2); color: var(--accent); border-radius: 6px; padding: 0 8px; font-weight: 800; }
        .ticker-item .t-live { color: var(--live-red); font-weight: 800; font-size: .7rem; }
        .ticker-item .t-info { color: var(--yellow); font-weight: 700; }
        @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } .ticker-viewport { overflow-x: auto; } }
        .video-wrap { position: relative; padding-top: 56.25%; margin-bottom: 8px; }
        .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
        .goal-video { margin-left: auto; background: var(--accent); color: #000; font-weight: 700; font-size: .68rem; padding: 2px 9px; border-radius: 10px; text-decoration: none; white-space: nowrap; }
        .goal-video:hover { background: #16a34a; }
        .detail-item.lineup { flex-direction: column; gap: 2px; line-height: 1.5; }


        @media (max-width: 600px) {
            .team { font-size: .85rem; }
            .score { font-size: 1rem; }
            .details-grid { grid-template-columns: 1fr; }
            .match-main { padding: .75rem; }
        }
    
        .sec-title { font-size: 1rem; font-weight: 800; margin: 1.4rem 0 .6rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .sec-title small { font-size: .7rem; color: var(--text-muted); font-weight: 600; }
        .m-row { display: grid; grid-template-columns: 78px 1fr auto 1fr; align-items: center; gap: 8px; background: var(--bg-card); border-radius: 10px; margin-bottom: 6px; padding: .6rem .75rem; border: 1px solid transparent; font-size: .85rem; }
        .m-row:hover { border-color: var(--border); background: var(--bg-card-hover); }
        .m-row.live { border-left: 4px solid var(--live-red); }
        .m-date { font-size: .7rem; color: var(--text-muted); font-weight: 600; line-height: 1.3; }
        .m-home { text-align: right; font-weight: 600; } .m-away { text-align: left; font-weight: 600; }
        .m-score { min-width: 64px; text-align: center; font-weight: 800; border-radius: 6px; padding: 2px 8px; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2); color: var(--accent); }
        .m-score.next { background: transparent; border-color: var(--border); color: var(--text-muted); font-weight: 700; }
        .m-live { color: var(--live-red); font-weight: 800; font-size: .7rem; display: block; }
        .m-logo { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin: 0 4px; background: #fff; border-radius: 50%; padding: 1px; }
        .note { font-size: .75rem; color: var(--text-muted); margin: .4rem 0; }
        @media (max-width: 600px) { .m-row { grid-template-columns: 1fr auto 1fr; } .m-date { grid-column: 1 / -1; } }

        .m-wrap { margin-bottom: 6px; }
        .m-wrap .m-row { margin-bottom: 0; cursor: pointer; }
        .m-wrap.open .m-row { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-color: var(--accent); }
        .m-date .chev { display: inline-block; transition: transform .2s; color: var(--accent); margin-left: 4px; }
        .m-wrap.open .chev { transform: rotate(90deg); }
        .m-detail { display: none; background: var(--bg-detail); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 10px 10px; padding: 1rem; font-size: .8rem; }
        .m-wrap.open .m-detail { display: block; }
        .d-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 20px; margin-bottom: .6rem; }
        .d-info div { color: var(--text-muted); } .d-info b { color: var(--text-main); font-weight: 600; }
        .d-ev { display: grid; grid-template-columns: 44px 24px 1fr; gap: 6px; align-items: center; background: rgba(255,255,255,.03); border-radius: 6px; padding: 4px 8px; margin-bottom: 3px; font-size: .75rem; }
        .d-ev .min { color: var(--accent); font-weight: 700; } .d-ev .tm { color: var(--text-muted); }
        .d-stats .bar-row { margin: 9px 0; }
        .d-stats .vals span:nth-child(2) { color: var(--text-muted); font-weight: 500; }
        .d-head { display: flex; justify-content: space-between; font-weight: 700; margin: .5rem 0; font-size: .8rem; }
        .d-lineups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
        .d-lineups h4 { font-size: .75rem; margin-bottom: 4px; }
        .d-player { display: flex; gap: 6px; padding: 2px 0; border-bottom: 1px solid rgba(128,128,128,.1); font-size: .75rem; }
        .d-player .n { color: var(--text-muted); min-width: 22px; text-align: right; } .d-player .pos { color: var(--text-muted); margin-left: auto; font-size: .65rem; }
        .d-sub { color: var(--text-muted); font-size: .7rem; margin: 6px 0 2px; text-transform: uppercase; letter-spacing: 1px; }
        .d-comm { max-height: 260px; overflow-y: auto; margin-top: 6px; }
        .d-comm div { padding: 3px 0; border-bottom: 1px solid rgba(128,128,128,.1); font-size: .75rem; }
        .d-comm b { color: var(--accent); margin-right: 6px; }
        .m-detail details summary { cursor: pointer; color: var(--text-muted); font-weight: 700; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; margin-top: .9rem; }
        @media (max-width: 600px) { .d-lineups { grid-template-columns: 1fr; } .m-wrap .m-row { grid-template-columns: 1fr auto 1fr; } }
        .d-ev .goal-video { margin-left: 8px; }
        .d-vid { margin: 4px 0 8px; } .d-vid video { width: 100%; max-height: 360px; border-radius: 8px; background: #000; }
        .vid-list details { background: rgba(255,255,255,.03); border-radius: 6px; padding: 5px 9px; margin-bottom: 4px; }
        .vid-list summary { cursor: pointer; font-size: .75rem; font-weight: 600; color: var(--text-main); text-transform: none; letter-spacing: 0; margin: 0; }
        .vid-list video { width: 100%; max-height: 360px; margin-top: 6px; border-radius: 8px; background: #000; }
        .vid-list a { color: var(--accent); }
        .filters button .ic { display: inline-block; transform-origin: 50% 60%; }
        .ic-today { animation: ic-flash 1.6s ease-in-out infinite; }
        .ic-goal { animation: ic-shake 2.2s ease-in-out infinite; }
        .ic-ball { animation: ic-roll 2.4s linear infinite; }
        @keyframes ic-flash { 0%,100% { transform: scale(1); filter: none; } 50% { transform: scale(1.25); filter: drop-shadow(0 0 4px #f59e0b); } }
        @keyframes ic-shake { 0%,60%,100% { transform: translateX(0) scale(1); } 65% { transform: translateX(-2px) scale(1.15); } 70% { transform: translateX(2px) scale(1.15); } 75% { transform: translateX(-2px) scale(1.15); } 80% { transform: translateX(2px) scale(1.15); } 85% { transform: translateX(0) scale(1); } }
        @keyframes ic-roll { 0% { transform: translateX(-2px) rotate(0); } 50% { transform: translateX(2px) rotate(180deg); } 100% { transform: translateX(-2px) rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .filters button .ic { animation: none; } }
        .filters button.btn-live { background: rgba(239,68,68,.12); border-color: var(--live-red); color: #fecaca; display: inline-flex; align-items: center; gap: 6px; }
        .filters button.btn-live:hover, .filters button.btn-live.active { background: var(--live-red); border-color: var(--live-red); color: #fff; }
        .ic-live { width: 10px; height: 10px; border-radius: 50%; background: var(--live-red); animation: pulse-animation 1.5s infinite, ic-blink 1s ease-in-out infinite; }
        .btn-live:hover .ic-live, .btn-live.active .ic-live { background: #fff; }
        @keyframes ic-blink { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(1.3); } }
        .live-count { background: rgba(0,0,0,.3); border-radius: 10px; padding: 0 7px; font-size: .7rem; font-weight: 800; }
        @media (prefers-reduced-motion: reduce) { .ic-live { animation: none; } }
        #goal-toasts { position: fixed; top: 80px; right: 16px; z-index: 1100; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); pointer-events: none; }
        .goal-toast { pointer-events: auto; cursor: pointer; background: linear-gradient(135deg, #16a34a, #22c55e); color: #04210f; border-radius: 14px; padding: 12px 18px; font-weight: 800; box-shadow: 0 10px 30px rgba(34,197,94,.45); display: flex; align-items: center; gap: 12px; animation: toast-in .5s cubic-bezier(.175,.885,.32,1.275), toast-glow 1s ease-in-out 3; }
        .goal-toast.out { animation: toast-out .4s ease forwards; }
        .goal-toast .ball { font-size: 1.8rem; animation: ball-spin 1s linear infinite; }
        .goal-toast .t1 { font-size: .7rem; letter-spacing: 2px; text-transform: uppercase; }
        .goal-toast .t2 { font-size: .95rem; }
        .goal-toast .t3 { font-size: .75rem; font-weight: 600; opacity: .8; }
        @keyframes toast-in { from { transform: translateX(120%) scale(.8); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes toast-out { to { transform: translateX(120%); opacity: 0; } }
        @keyframes toast-glow { 50% { box-shadow: 0 0 0 10px rgba(34,197,94,.15), 0 10px 30px rgba(34,197,94,.6); } }
        @keyframes ball-spin { to { transform: rotate(360deg); } }
        .m-row.goal-now { animation: goal-flash 1s ease-in-out 6; border-color: var(--accent); }
        @keyframes goal-flash { 0%,100% { background: var(--bg-card); } 50% { background: rgba(34,197,94,.28); } }
        .goal-badge { display: inline-block; background: var(--accent); color: #000; font-weight: 800; font-size: .65rem; border-radius: 10px; padding: 1px 8px; margin-bottom: 2px; animation: goal-pop .6s ease-in-out infinite alternate; }
        @keyframes goal-pop { from { transform: scale(1); } to { transform: scale(1.18); } }
        .goal-now .m-score { animation: goal-pop .6s ease-in-out infinite alternate; }
        @media (prefers-reduced-motion: reduce) { .goal-toast, .goal-toast .ball, .m-row.goal-now, .goal-badge, .goal-now .m-score { animation: none; } }
        .g-links { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: .6rem; }
        .g-links a { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 5px 13px; border-radius: 20px; font-size: .75rem; font-weight: 700; text-decoration: none; }
        .g-links a:hover { border-color: var(--accent); }
        .std-box { margin-bottom: .75rem; }
        .standings td.tn { text-align: left; white-space: nowrap; }

<body>
<div id="goal-toasts" aria-live="polite"></div>

    <header>

        </div>

            </div>
        </div>
    </header>

    <main class="container">
        <div class="sec-title">📅 Calendrier & résultats <small>touchez un match pour voir les statistiques détaillées</small></div>
        <div class="control-group">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                <div class="filters" id="filters">

                    <button data-tab="results"><span class="ic ic-goal">🥅</span> Résultats</button>
                    <button data-tab="next"><span class="ic ic-ball">⚽</span> À venir</button>

        </div>
        <div id="matches"><div class="empty">Chargement du calendrier…</div></div>
        <p class="note" id="static-note"></p>

    </main>

    <footer><div class="container"><p>FootLive Pro © 2026 — <span id="updated"></span></p></div></footer>

    <script>
        // ===== CONFIGURATION =====
        const CFG = {
            // Laisser vide = la page interroge ESPN directement. Ou mettre l'URL de votre Worker (worker.js, avec "/" final) pour mutualiser le cache.
            PROXY_URL: "",
            ESPN: "https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard",
            DAYS_BEFORE: 2, DAYS_AFTER: 3,           // fenêtre de jours chargée autour d'aujourd'hui
            LIVE_REFRESH_MS: 30 * 1000,              // jour en cours (direct)
            OTHER_REFRESH_MS: 30 * 60 * 1000         // autres jours
        };
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
        const localDay = iso => new Date(iso).toLocaleDateString("sv-SE");
        const hhmm = iso => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        const byDay = {};              // "YYYYMMDD" -> [matchs]
        let tab = "today", tickerSig = "", lastErr = "", lastOk = 0;

        // ===== Récupération + normalisation des données ESPN =====
        function leagueOf(ev, top) {
            const c = (ev.competitions && ev.competitions[0]) || {};

            const fromTop = (top.leagues || []).find(l => String(l.id) === lid);
            return (ev.league && ev.league.name) || (c.league && c.league.name) || (fromTop && fromTop.name) || (ev.season && ev.season.slug && ev.season.slug.replace(/-/g, " ")) || "Football — autres compétitions";
        }
        function slugOf(ev, top) {
            const lid = ((ev.uid || "").match(/l:(\d+)/) || [])[1];

        }
        function normalize(ev, top, forced) {

            const ht = /half/i.test(st.description || "") && !/second|first/i.test(st.description || "") || /halftime/i.test(st.name || "");

                id: ev.id, slug: forced || slugOf(ev, top), lg: leagueOf(ev, top), start: ev.date, state, off,
                label: off ? (st.description || "Reporté") : ht ? "Mi-temps" : ((ev.status && ev.status.displayClock) || st.shortDetail || ""),
                home: home.team.displayName || home.team.name, away: away.team.displayName || away.team.name,
                hl: home.team.logo, al: away.team.logo,

        }
        function endpoint(d) {
            const base = CFG.PROXY_URL ? CFG.PROXY_URL.replace(/\/?$/, "/") + "soccer/all/scoreboard" : CFG.ESPN;
            return base + "?dates=" + d + "&limit=1000";
        }
        // Compétitions exclues définitivement + ligues ajoutées explicitement
        const BLOCK = /bolivia|scotti?s?h|scotland/i;
        const EXTRA = [];
        function lgUrl(slug, d) {
            const base = CFG.PROXY_URL ? CFG.PROXY_URL.replace(/\/?$/, "/") + "soccer/" + slug + "/scoreboard" : "https://site.api.espn.com/apis/site/v2/sports/soccer/" + slug + "/scoreboard";
            return base + "?dates=" + d + "&limit=1000";
        }
        async function loadDay(d) {
            const r = await fetch(endpoint(d));
            if (!r.ok) throw new Error("Le serveur a répondu " + r.status);

        function allDays(offsetFrom, offsetTo) {

            const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 400); };

        // ===== Botola (Maroc) & Ligue égyptienne : source complémentaire =====

        let tsIds = null, tsStatus = "";

        async function loadTsdb() {
            try {
                if (!tsIds) {
                    tsIds = [];
                    for (const c of TS_COUNTRIES) {
                        const j = await (await fetch(TSDB + "search_all_leagues.php?c=" + c + "&s=Soccer")).json();
                        const ls = (j.countries || j.countrys || []).filter(l => !/women|cup|\b2\b|second|youth|u-?\d|amateur/i.test((l.strLeague || "") + " " + (l.strLeagueAlternate || "")));

                }

                tsStatus = evs.length ? `Botola Pro : ${evs.length} matchs chargés.` : "Botola Pro : aucun match trouvé pour le moment.";
            } catch (e) { tsStatus = "Botola Pro : source indisponible."; tsIds = null; }
        }
        function tsDetail(m) {
            const e = m.raw || {}, rows = [["Compétition", m.lg], ["Statut", e.strStatus], ["Coup d'envoi", new Date(m.start).toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })], ["🏟️ Stade", e.strVenue], ["Journée", e.intRound], ["Saison", e.strSeason], ["Pays", e.strCountry]].filter(r => r[1]);

        }
        async function refresh(days) {

        const all = () => Object.values(byDay).flat();

        }
        // ===== Détails du match (ESPN summary) =====
        const FR = { possessionPct: "Possession (%)", totalShots: "Tirs", shotsOnTarget: "Tirs cadrés", blockedShots: "Tirs bloqués", shotPct: "Tirs cadrés (%)", wonCorners: "Corners", foulsCommitted: "Fautes commises", offsides: "Hors-jeu", yellowCards: "Cartons jaunes", redCards: "Cartons rouges", saves: "Arrêts du gardien", totalPasses: "Passes", accuratePasses: "Passes réussies", passPct: "Passes réussies (%)", effectiveTackles: "Tacles réussis", totalTackles: "Tacles", tacklePct: "Tacles réussis (%)", interceptions: "Interceptions", totalCrosses: "Centres", accurateCrosses: "Centres réussis", crossPct: "Centres réussis (%)", totalLongBalls: "Longs ballons", accurateLongBalls: "Longs ballons réussis", longballPct: "Longs ballons réussis (%)", effectiveClearance: "Dégagements réussis", totalClearance: "Dégagements", penaltyKickGoals: "Penalties marqués", penaltyKickShots: "Penalties tirés", shotAssists: "Passes décisives de tir", goalAssists: "Passes décisives", ownGoals: "Contre son camp", totalGoals: "Buts" };
        const ORDER = ["possessionPct", "totalShots", "shotsOnTarget", "blockedShots", "wonCorners", "foulsCommitted", "offsides", "yellowCards", "redCards", "saves", "totalPasses", "accuratePasses", "passPct", "totalCrosses", "accurateCrosses", "totalLongBalls", "accurateLongBalls", "effectiveTackles", "totalTackles", "interceptions", "effectiveClearance", "totalClearance"];
        const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.\-]/g, "")); return isNaN(n) ? null : n; };
        function icon(t) {

            if (/yellow/.test(t)) return "🟨"; if (/red/.test(t)) return "🟥"; if (/substitution/.test(t)) return "🔄"; if (/var/.test(t)) return "📺";

        }
        const normName = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        function vidInfo(v) {

            if (vids.length) out += `<div class="section-title">🎬 Vidéos du match</div><div class="vid-list">` + vids.slice(0, 12).map(v => v.src
                ? `<details><summary>▶ ${esc(v.title)}</summary><video controls preload="none" playsinline ${v.poster ? `poster="${esc(v.poster)}"` : ""}><source src="${esc(v.src)}" type="video/mp4"></video></details>`
                : `<div style="padding:3px 9px"><a href="${esc(v.web)}" target="_blank" rel="noopener">▶ ${esc(v.title)}</a></div>`).join("") + `</div>`;
            else if (m.state !== "pre") out += `<div class="section-title">🎬 Vidéos</div><div class="note"><a class="goal-video" style="margin:0" href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.home + " vs " + m.away + " highlights")}" target="_blank" rel="noopener">▶ Résumé sur YouTube</a></div>`;
            // Statistiques d'équipe
            const teams = (s.boxscore && s.boxscore.teams) || [];
            const th = teams.find(t => String(t.team.id) === homeId) || teams[0], ta = teams.find(t => t !== th) || teams[1];
            if (th && ta && (th.statistics || []).length) {
                const A = {}; (ta.statistics || []).forEach(x => A[x.name] = x);
                const rows = (th.statistics || []).slice().sort((x, y) => { const i = ORDER.indexOf(x.name), j = ORDER.indexOf(y.name); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
                out += `<div class="section-title">Statistiques du match</div><div class="d-head"><span>${esc(m.home)}</span><span>${esc(m.away)}</span></div><div class="d-stats">` + rows.map(x => {
                    const y = A[x.name] || {}, hv = x.displayValue ?? x.value ?? "-", av = y.displayValue ?? y.value ?? "-", hn = num(hv), an = num(av);
                    const tot = (hn || 0) + (an || 0), hp = tot > 0 ? hn / tot * 100 : 50;
                    return `<div class="bar-row"><div class="vals"><span>${esc(hv)}</span><span class="lbl">${esc(FR[x.name] || x.label || x.name)}</span><span>${esc(av)}</span></div>${hn != null && an != null ? `<div class="bar"><div class="h" style="width:${hp}%"></div><div class="a" style="width:${100 - hp}%"></div></div>` : ""}</div>`;
                }).join("") + `</div>`;
            }
            // Compositions
            const ros = s.rosters || [];
            if (ros.length) {
                const sv = (p, n) => Number(((p.stats || []).find(z => z.name === n) || {}).value || 0);
                const pl = p => { const a = p.athlete || {}, g = sv(p, "totalGoals"), as = sv(p, "goalAssists"), y = sv(p, "yellowCards"), r = sv(p, "redCards");
                    return `<div class="d-player"><span class="n">${esc(p.jersey || "")}</span><span>${esc(a.displayName || a.fullName || "")} ${g ? "⚽".repeat(Math.min(g, 4)) : ""}${as ? "🅰️" + (as > 1 ? as : "") : ""}${y ? "🟨" : ""}${r ? "🟥" : ""}${p.subbedOut ? " 🔻" : ""}${p.subbedIn ? " 🔺" : ""}</span><span class="pos">${esc((p.position && p.position.abbreviation) || "")}</span></div>`; };
                const col = r => { const ro = r.roster || [], name = esc(tname[String((r.team || {}).id)] || (r.homeAway === "home" ? m.home : m.away));
                    return `<div><h4>${name}${r.formation ? " · " + esc(r.formation.summary || r.formation) : ""}</h4>${ro.filter(p => p.starter).map(pl).join("") || '<div class="note">Non communiquée</div>'}${ro.some(p => !p.starter) ? `<div class="d-sub">Remplaçants</div>` + ro.filter(p => !p.starter).map(pl).join("") : ""}</div>`; };
                const h = ros.find(r => r.homeAway === "home") || ros[0], a = ros.find(r => r !== h);
                out += `<div class="section-title">Compositions <span class="note">(⚽ but · 🅰️ passe déc. · 🟨🟥 cartons · 🔻 sorti · 🔺 entré)</span></div><div class="d-lineups">${col(h)}${a ? col(a) : ""}</div>`;
            }
            out += extraHTML(s, tname, m);
            // Commentaires
            const cm = (s.commentary || []).slice().reverse().slice(0, 120);
            if (cm.length) out += `<details><summary>Commentaires minute par minute (${cm.length})</summary><div class="d-comm">${cm.map(c => `<div><b>${esc((c.time && c.time.displayValue) || "")}</b>${esc(c.text || "")}</div>`).join("")}</div></details>`;
            if (!(s.boxscore && (s.boxscore.teams || []).length) && !evs.length && !ros.length) out += `<div class="note">Pas encore de statistiques : elles apparaîtront dès le coup d'envoi (ou la couverture est limitée pour cette compétition).</div>`;
            return out + radioHTML(m);
        }
        // ===== Radios en direct (lecture intégrée dans la page) =====
        // "stream" = URL du flux audio (mp3/aac ou .m3u8 HLS). Si un flux est bloqué ou change, remplacez simplement son URL ici.
        const RADIOS = {
            es: [{ name: "Cadena SER", url: "https://cadenaser.com/", stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3" }, { name: "COPE", url: "https://www.cope.es/directos/cope", stream: "https://cope-cdnmobile.flumotion.com/playlist.m3u8" }],
            en: [{ name: "BBC Radio 5 Live", url: "https://www.bbc.co.uk/sounds/play/live:bbc_radio_five_live", stream: "https://as-hls-ww-live.akamaized.net/pool_89021708/live/ww/bbc_radio_five_live/bbc_radio_five_live.isml/bbc_radio_five_live-audio%3d96000.norewind.m3u8" }, { name: "talkSPORT", url: "https://talksport.com/live/", stream: "https://radio.talksport.com/stream" }],
            fr: [{ name: "RMC Radio", url: "https://rmc.bfmtv.com/mediaplayer/live-radio/", stream: "https://audio.bfmtv.com/rmcradio_128.mp3" }],
            it: [{ name: "RAI Radio 1", url: "https://www.raiplaysound.it/radio1", stream: "https://icestreaming.rai.it/1.mp3" }],
            ma: [{ name: "Medi1 Radio", url: "https://www.medi1.com/", stream: "https://streaming2.medi1.com/medi1fm" }, { name: "Radio Mars", url: "https://www.radiomars.ma/", stream: "https://radiomars.ice.infomaniak.ch/radiomars-128.mp3" }]
        };
        // Lecteur HLS (.m3u8) chargé à la demande
        let hlsLib = null;
        function loadHls() {
            if (window.Hls) return Promise.resolve(window.Hls);
            return hlsLib || (hlsLib = new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"; sc.onload = () => ok(window.Hls); sc.onerror = () => ko(new Error("hls")); document.head.appendChild(sc); }));
        }
        function radioFail(pl, audio, name, url) {
            if (audio.__hls) { audio.__hls.destroy(); audio.__hls = null; }
            pl.innerHTML = `<div class="note">⚠️ Flux indisponible pour « ${esc(name)} » (bloqué par la radio ou hors de votre pays). <a class="radio-btn" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le site de la radio ↗</a></div>`;
        }
        function playRadio(btn) {
            const box = btn.closest(".radio-box"), pl = box.querySelector(".radio-player"), src = btn.dataset.stream, name = btn.dataset.name, url = btn.dataset.url;
            pl.innerHTML = `<div class="note">⏳ Connexion à ${esc(name)}…</div>`;
            const au = document.createElement("audio"); au.controls = true; au.preload = "none"; au.dataset.stream = src; au.dataset.name = name; au.dataset.url = url;
            au.addEventListener("error", () => radioFail(pl, au, name, url));
            au.addEventListener("playing", () => { const n = pl.querySelector(".note"); if (n) n.remove(); });
            pl.appendChild(au);
            const go = () => au.play().catch(err => { if (err && err.name === "NotAllowedError") { const n = pl.querySelector(".note"); if (n) n.textContent = "Touchez ▶ pour lancer la lecture."; } });
            if (/\.m3u8(\?|$)/i.test(src) && !au.canPlayType("application/vnd.apple.mpegurl")) {
                loadHls().then(Hls => {
                    if (!Hls || !Hls.isSupported()) return radioFail(pl, au, name, url);
                    const h = new Hls(); au.__hls = h; h.loadSource(src); h.attachMedia(au);
                    h.on(Hls.Events.MANIFEST_PARSED, go);
                    h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) radioFail(pl, au, name, url); });
                }).catch(() => radioFail(pl, au, name, url));
            } else { au.src = src; go(); }
        }
        function stopRadio(box) { const pl = box.querySelector(".radio-player"), au = pl.querySelector("audio"); if (au) { au.pause(); if (au.__hls) au.__hls.destroy(); } pl.innerHTML = ""; box.querySelectorAll(".radio-btn.on").forEach(x => x.classList.remove("on")); }
        function radiosFor(lg) {
            const n = String(lg || ""), k = [];
            if (/spanish|la ?liga|copa del rey|supercopa/i.test(n)) k.push("es");
            if (/english|premier league|fa cup|efl|carabao|community shield/i.test(n)) k.push("en");
            if (/french|ligue 1|coupe de france/i.test(n)) k.push("fr");
            if (/italian|serie a|coppa italia/i.test(n)) k.push("it");
            if (/moroccan|botola|morocco/i.test(n)) k.push("ma");
            if (/champions league|europa|conference|world cup|nations|euro/i.test(n)) k.push("es", "en", "fr");
            return [...new Set(k)].flatMap(x => RADIOS[x]);
        }
        function radioHTML(m) {
            if (m.state === "post" && Date.now() - new Date(m.start).getTime() > 6 * 3600e3) return "";
            const rs = radiosFor(m.lg), q = encodeURIComponent(m.home + " " + m.away + " radio directo commentaire live");
            return `<div class="section-title">📻 Radio en direct <span class="note">(écoute directe sur le site)</span></div><div class="radio-box">` + rs.map(r => r.stream
                ? `<button class="radio-btn" data-stream="${esc(r.stream)}" data-name="${esc(r.name)}" data-url="${esc(r.url)}">▶ ${esc(r.name)}</button>`
                : `<a class="radio-btn" href="${esc(r.url)}" target="_blank" rel="noopener">📻 ${esc(r.name)} ↗</a>`).join("")
                + `<a class="radio-btn" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">🔎 Autre radio ↗</a><div class="radio-player"></div></div>`;
        }
        function summaryUrl(m) {
            const base = CFG.PROXY_URL ? CFG.PROXY_URL.replace(/\/?$/, "/") + "soccer/" + m.slug + "/summary" : "https://site.api.espn.com/apis/site/v2/sports/soccer/" + m.slug + "/summary";
            return base + "?event=" + encodeURIComponent(m.id);
        }
        function paintDetail(id) {
            const c = cache[id]; if (!c) return;
            document.querySelectorAll('.m-wrap[data-id="' + CSS.escape(id) + '"] .m-detail').forEach(el => {
                if (el.dataset.h === c.html && el.innerHTML) { el.querySelectorAll(".pitch-box").forEach(initPitch); return; }
                const keep = el.querySelector(".radio-player audio"), src = keep && keep.dataset.stream;
                el.innerHTML = c.html; el.dataset.h = c.html;
                if (keep) { const np = el.querySelector(".radio-player"); if (np) { np.appendChild(keep); const b = [...el.querySelectorAll("button.radio-btn[data-stream]")].find(x => x.dataset.stream === src); if (b) b.classList.add("on"); } }
                el.querySelectorAll(".pitch-box").forEach(initPitch);
            });
        }
        async function loadDetail(id, silent) {
            const m = all().find(x => x.id === id); if (!m) return;
            if (m.tsdb) { cache[id] = { html: tsDetail(m), t: Date.now() }; paintDetail(id); return; }
            if (!silent && !cache[id]) { cache[id] = { html: '<div class="note">Chargement des statistiques…</div>', t: 0 }; paintDetail(id); }
            try {
                const r = await fetch(summaryUrl(m));
                if (!r.ok) throw new Error("Le serveur a répondu " + r.status);
                cache[id] = { html: detailHTML(await r.json(), m), t: Date.now() };
            } catch (e) { if (!cache[id] || !cache[id].t) cache[id] = { html: `<div class="note">⚠️ Impossible de charger les détails (${esc(e.message)}). Touchez à nouveau pour réessayer.</div>`, t: 0 }; }
            paintDetail(id);
        }
        function refreshOpen() { open.forEach(id => { const m = all().find(x => x.id === id); if (m && m.state === "in") loadDetail(id, true); }); }
        document.addEventListener("click", e => {
            const rp = e.target.closest(".pitch-replay");
            if (rp) { const id = rp.closest(".pitch-box").dataset.pid, A = anim[id], d = pitchData[id] || []; if (A) { if (A.timer) { clearTimeout(A.timer); A.timer = null; } A.shown = Math.max(0, d.length - 25); pitchRun(id); } return; }
            const rb = e.target.closest("button.radio-btn[data-stream]");
            if (rb) {
                const box = rb.closest(".radio-box");
                if (rb.classList.contains("on")) { stopRadio(box); return; }
                stopRadio(box); rb.classList.add("on"); playRadio(rb); return;
            }
            const sb = e.target.closest(".standings-btn[data-std]");
            if (sb) {
                const sl = sb.dataset.std;
                if (stdOpen.has(sl)) { stdOpen.delete(sl); paintStd(sl); }
                else { stdOpen.add(sl); const c = stdCache[sl]; if (c && c.t && Date.now() - c.t < 600000) paintStd(sl); else loadStd(sl); }
                return;
            }
            const gv = e.target.closest("a.goal-video[data-src]");
            if (gv) {
                e.preventDefault();
                const ev = gv.closest(".d-ev"), nx = ev.nextElementSibling;
                if (nx && nx.classList.contains("d-vid")) { nx.remove(); return; }
                const box = document.createElement("div"); box.className = "d-vid";
                box.innerHTML = `<video controls autoplay playsinline ${gv.dataset.poster ? `poster="${esc(gv.dataset.poster)}"` : ""}><source src="${esc(gv.dataset.src)}" type="video/mp4"></video>`;
                ev.after(box); return;
            }
            const row = e.target.closest(".m-row"); if (!row) return;
            const w = row.closest(".m-wrap"); if (!w) return;
            const id = w.dataset.id, on = !open.has(id);
            on ? open.add(id) : open.delete(id);
            document.querySelectorAll('.m-wrap[data-id="' + CSS.escape(id) + '"]').forEach(x => x.classList.toggle("open", on));
            if (on) { paintDetail(id); const c = cache[id], m = all().find(x => x.id === id); if (!c || !c.t || (m && m.state !== "post" && Date.now() - c.t > 20000)) loadDetail(id); }
        });
        // ===== Classement des compétitions par importance =====
        const LG_RANK = [
            /world cup(?!.*(qualif|u-?\d|women))/i, /uefa champions league/i, /euro(pean)? championship(?!.*(qualif|u-?\d|women))/i, /copa am[eé]rica/i, /africa cup of nations|afcon/i,
            /english premier league|^premier league$/i, /spanish la ?liga|^la ?liga$|laliga(?!.*2)/i, /german bundesliga|^bundesliga$/i, /italian serie a|^serie a$/i, /french ligue 1|^ligue 1$/i,
            /uefa europa league/i, /uefa conference league|europa conference/i, /nations league/i, /caf champions league/i, /copa libertadores/i, /fifa club world cup/i,
            /moroccan|botola|morocco/i, /portuguese primeira|primeira liga/i, /dutch eredivisie|^eredivisie$/i, /saudi/i, /turkish s[uü]per|s[uü]per lig/i, /belgian pro|jupiler/i,
            /brazilian serie a|brasileir[aã]o/i, /argentine|liga profesional/i, /major league soccer|^mls$/i, /mexican|liga mx/i,
            /fa cup|copa del rey|dfb[- ]pokal|coppa italia|coupe de france|efl cup|carabao/i, /super cup|supercopa|community shield/i, /caf confederation|copa sudamericana|afc champions/i,
            /qualif/i, /friendl|international/i
        ];
        function lgRank(n) {
            n = String(n || "");
            if (/women|feminin|féminin|\bu-?\d{2}\b|youth|reserve|\bb team\b/i.test(n)) return 500;
            const i = LG_RANK.findIndex(r => r.test(n));
            if (i >= 0) return i;
            if (/\b(2|ii|second|championship|segunda|serie b|ligue 2|division 2|league one|league two)\b/i.test(n)) return 200;
            return 100;
        }
        const lgCmp = (a, b) => lgRank(a) - lgRank(b) || a.localeCompare(b, "fr");
        const BOTOLA_BTN = '';
        function grouped(list, rowFn, withBtn) {
            const g = {};
            list.forEach(m => (g[m.lg] ||= []).push(m));
            const br = lgRank("Moroccan Botola Pro"); let placed = !withBtn;
            let out = Object.keys(g).sort(lgCmp).map(k => {
                let pre = ""; if (!placed && lgRank(k) >= br) { pre = BOTOLA_BTN; placed = true; }
                const sl = (g[k].find(m => m.slug && m.slug !== "all" && m.slug !== "tsdb") || {}).slug;
                const sbtn = sl ? `<button class="standings-btn" data-std="${esc(sl)}">🏆 Classement</button>` : "";
                const sbox = sl && stdOpen.has(sl) && stdCache[sl] ? `<div class="standings std-box" data-slug="${esc(sl)}">${stdCache[sl].html}</div>` : "";
                return pre + `<section class="competition-group"><div class="competition-header"><span class="flag">${FLAG}</span>${esc(k)}${sbtn}<span class="count">${g[k].length} match(s)</span></div>${sbox}${g[k].map(rowFn).join("")}</section>`;
            }).join("");
            return placed ? out : out + BOTOLA_BTN;
        }
        function renderLive() {
            const box = document.getElementById("live-list"), meta = document.getElementById("live-meta");
            if (!box || !meta) return;
            const live = all().filter(m => m.state === "in");
            meta.textContent = lastOk ? `actualisé à ${new Date(lastOk).toLocaleTimeString("fr-FR")} · toutes les ${CFG.LIVE_REFRESH_MS / 1000} s · ${live.length} match(s)` : "";
            if (lastErr && !all().length) { box.innerHTML = `<div class="empty">⚠️ ${esc(lastErr)}</div>`; return; }
            box.innerHTML = live.length ? grouped(live, liveRow) : `<div class="empty">${all().length ? "Aucun match en direct pour le moment." : "Chargement du direct…"}</div>`;
        }
        function renderMatches() {
            const q = document.getElementById("search").value.trim().toLowerCase(), lgSel = document.getElementById("league-filter");
            const names = [...new Set(all().map(m => m.lg))].sort(lgCmp);
            const cur = lgSel.value || "all";
            const opts = `<option value="all">🌍 Toutes les compétitions</option>` + names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
            if (lgSel.dataset.sig !== opts) { lgSel.innerHTML = opts; lgSel.dataset.sig = opts; lgSel.value = names.includes(cur) ? cur : "all"; }
            const t = localDay(new Date().toISOString());
            let list = all().filter(m => (lgSel.value === "all" || m.lg === lgSel.value) && (!q || (m.home + " " + m.away + " " + m.lg).toLowerCase().includes(q)));
            const lc = document.getElementById("live-count"); if (lc) lc.textContent = all().filter(m => m.state === "in").length;
            if (tab === "live") list = list.filter(m => m.state === "in").sort((a, b) => a.start.localeCompare(b.start));
            else if (tab === "today") list = list.filter(m => localDay(m.start) === t).sort((a, b) => a.start.localeCompare(b.start));
            else if (tab === "results") list = list.filter(m => m.state === "post").sort((a, b) => b.start.localeCompare(a.start)).slice(0, 150);
            else list = list.filter(m => m.state === "pre" && localDay(m.start) >= t).sort((a, b) => a.start.localeCompare(b.start)).slice(0, 150);
            document.getElementById("matches").innerHTML = list.length ? grouped(list, rowHTML, true) : BOTOLA_BTN + `<div class="empty">${all().length ? (tab === "live" ? "Aucun match en direct pour le moment." : "Aucun match pour ces critères.") : "Chargement du calendrier…"}</div>`;
        }
        function updateTicker() {
            const item = h => `<span class="ticker-item">${h}</span>`, items = [], A = all(), t = localDay(new Date().toISOString());
            const sc = m => `<span class="t-score">${m.h ?? 0} - ${m.a ?? 0}</span>`;
            A.filter(m => m.state === "in").forEach(m => items.push(item(`<span class="t-comp">${esc(m.lg)}</span> <span class="t-live">● ${esc(m.label)}</span> ${esc(m.home)} ${sc(m)} ${esc(m.away)}`)));
            A.filter(m => m.state === "post").sort((a, b) => b.start.localeCompare(a.start)).slice(0, 15).forEach(m => items.push(item(`<span class="t-comp">${esc(m.lg)}</span> <span class="t-comp">Terminé</span> ${esc(m.home)} ${sc(m)} ${esc(m.away)}`)));
            A.filter(m => m.state === "pre" && !m.off).sort((a, b) => a.start.localeCompare(b.start)).slice(0, 15).forEach(m => items.push(item(`<span class="t-comp">${esc(m.lg)}</span> <span class="t-info">${new Date(m.start).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} ${hhmm(m.start)}</span> ${esc(m.home)} vs ${esc(m.away)}`)));
            const today = A.filter(m => localDay(m.start) === t), live = today.filter(m => m.state === "in").length;
            const goals = today.reduce((n, m) => n + (m.state === "pre" ? 0 : (m.h || 0) + (m.a || 0)), 0);
            if (today.length) items.push(item(`🌍 <span class="t-info">${today.length}</span> matchs aujourd'hui · <span class="t-info">${live}</span> en direct · ⚽ <span class="t-info">${goals}</span> buts marqués`));
            if (!items.length) items.push(item(lastErr ? "⚠️ " + esc(lastErr) : "Chargement des infos du football…"));
            const html = items.join("");
            if (html === tickerSig) return;
            tickerSig = html;
            const track = document.getElementById("ticker-track");
            track.innerHTML = html + html;
            track.style.setProperty("--ticker-duration", Math.max(30, (track.scrollWidth / 2) / 70) + "s");
        }
        function renderAll() {
            renderLive(); renderMatches(); updateTicker();
            document.getElementById("static-note").textContent = "Horaires affichés dans votre fuseau horaire. " + tsStatus;
            document.getElementById("updated").textContent = lastErr ? "⚠️ " + lastErr : "Dernière mise à jour : " + new Date(lastOk || Date.now()).toLocaleTimeString("fr-FR");
        }

        document.getElementById("filters").addEventListener("click", e => {
            const b = e.target.closest("button"); if (!b) return;
            document.querySelectorAll("#filters button").forEach(x => x.classList.remove("active"));
            b.classList.add("active"); tab = b.dataset.tab; renderMatches();
        });
        document.getElementById("league-filter").addEventListener("change", renderMatches);
        document.getElementById("search").addEventListener("input", renderMatches);

        refresh(allDays(-CFG.DAYS_BEFORE, CFG.DAYS_AFTER));
        setInterval(() => refresh(allDays(0, 0)).then(refreshOpen), CFG.LIVE_REFRESH_MS);
        setInterval(() => refresh(allDays(-CFG.DAYS_BEFORE, CFG.DAYS_AFTER)), CFG.OTHER_REFRESH_MS);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(allDays(0, 0)); });
    </script>
</body>
